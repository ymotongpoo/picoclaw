apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: picoclaw-workspace
  namespace: picoclaw
  labels:
    app: picoclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Specify storageClassName according to your environment
  # storageClassName: standard
